name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests and release build
        # No signing secrets here, so the release APK is built unsigned: this only checks it builds.
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

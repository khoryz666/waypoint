name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(sed -n 's/^waypoint.version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match waypoint.version=$version in gradle.properties"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.name }}"
            exit 1
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WAYPOINT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret WAYPOINT_KEYSTORE_BASE64 is not set - see docs/signing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "WAYPOINT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.WAYPOINT_KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.WAYPOINT_KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.WAYPOINT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk "Waypoint-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Waypoint ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          files: Waypoint-${{ steps.version.outputs.name }}.apk
